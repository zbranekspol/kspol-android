name: Build STABLE RESET v8 step 7 shop links and admin entry

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable step 7 shop links and admin entry
        run: python3 tests/verify_step7.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test APK
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare test file
        run: cp app/build/outputs/apk/debug/app-debug.apk Kspol_STABLE_RESET_v8_STEP7_SHOP_LINKS_ADMIN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kspol-STABLE-RESET-v8-STEP7-SHOP-LINKS-ADMIN
          path: Kspol_STABLE_RESET_v8_STEP7_SHOP_LINKS_ADMIN.apk
          if-no-files-found: error
